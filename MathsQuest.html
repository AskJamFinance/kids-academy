<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎈 Magic Maths Quest! 🎈</title>
    <style>
        :root {
            --bg-color: #F7FFF7;
            --text-color: #2F3E46;
            --primary-blue: #3A86FF;
            --sunny-yellow: #FFBE0B;
            --happy-pink: #FF006E;
            --bright-green: #38B000;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        body {
            background-color: #E2E8F0; /* Soft background desktop view */
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* iPhone Canvas Box Wrapper */
        .iphone-screen {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 412px; /* Emulates standard iPhone width */
            height: 840px;
            max-height: 92vh;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 8px solid #1e293b; /* Sleek bezel */
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            background: white;
            padding: 8px 15px;
            border-radius: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border: 3px solid var(--sunny-yellow);
        }

        h1 {
            color: var(--happy-pink);
            margin: 0;
            font-size: 1.5rem;
            text-shadow: 1px 1px 0px var(--sunny-yellow);
        }

        /* Set Selection Bar Horizontal Scrollable on iPhone */
        .set-selector-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        .set-selector-bar::-webkit-scrollbar {
            height: 4px;
        }
        .set-selector-bar::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }

        .set-btn {
            background: white;
            border: 2px solid var(--primary-blue);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--primary-blue);
            white-space: nowrap;
            color: var(--primary-blue);
        }

        .set-btn.active {
            background: var(--sunny-yellow);
            color: var(--text-color);
            border-color: #E2A000;
            box-shadow: 0 3px 0 #E2A000;
            transform: translateY(1px);
        }

        /* Smartphone Dynamic Workspace Stack */
        .workspace-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            flex-grow: 1;
        }

        /* HORIZONTAL REWARD TRACKER PILLAR */
        .achievement-pillar {
            width: 100%;
            background: white;
            border: 3px solid var(--primary-blue);
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            flex-direction: row;
            align-items: center;
            position: relative;
            height: 65px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            gap: 12px;
        }

        .track-rail-bg {
            height: 16px;
            background: #E2E8F0;
            border-radius: 12px;
            flex-grow: 1;
            position: relative;
            border: 2px solid #CBD5E1;
            margin-right: 25px; /* Give room for the crown */
        }

        .track-rail-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, var(--happy-pink), var(--sunny-yellow));
            border-radius: 12px;
            position: absolute;
            left: 0;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .avatar-rider {
            position: absolute;
            left: 0%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1));
            user-select: none;
        }

        .goal-post {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.6rem;
            z-index: 5;
            animation: floatBounce 1.5s infinite ease-in-out;
        }

        @keyframes floatBounce {
            0%, 100% { transform: translateY(-50%) translateY(0); }
            50% { transform: translateY(-50%) translateY(-4px); }
        }

        .pillar-label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #4A5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 65px;
            text-align: left;
            line-height: 1.1;
        }

        /* Right Side Gameboard Panel */
        .gameboard {
            background: white;
            border-radius: 24px;
            flex-grow: 1;
            padding: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.05);
            border: 3px solid #E2E8F0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Star Tracker Bar */
        .star-tracker {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-bottom: 8px;
            background: #F0F4F8;
            padding: 6px;
            border-radius: 14px;
            flex-wrap: wrap;
            width: 100%;
        }

        .star {
            font-size: 0.85rem;
            color: #CBD5E1;
            transition: transform 0.2s ease;
        }

        .star.earned {
            color: var(--sunny-yellow);
            transform: scale(1.1);
        }

        .badge-info {
            background: #EBF5FF;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 8px;
            color: var(--primary-blue);
        }

        /* Vertical column presentation setup optimized for mobile viewport */
        .column-math-container {
            display: inline-block;
            font-size: 3.5rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--primary-blue);
            margin: 10px auto;
            text-align: right;
            position: relative;
            padding-right: 15px;
        }

        .math-row {
            letter-spacing: 4px;
            line-height: 1.1;
        }

        .plus-sign {
            position: absolute;
            left: -45px;
            bottom: 55px;
            color: var(--happy-pink);
        }

        .equals-bar {
            border-bottom: 5px solid var(--text-color);
            margin-top: 2px;
            margin-bottom: 5px;
            width: 120%;
            display: inline-block;
        }

        .question-mark-box {
            color: #CBD5E1;
            text-align: right;
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 4px;
        }

        /* Answer Buttons Selection Grid layout adjusted for mobile finger taps */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
            width: 100%;
        }

        .ans-btn {
            background: white;
            border: 3px solid #64748B;
            border-radius: 16px;
            padding: 10px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #64748B;
            transition: all 0.1s;
        }

        .ans-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #64748B;
        }

        /* Feedback Display Text block */
        .cheer-msg {
            background: #E8F5E9;
            color: var(--bright-green);
            border: 2px solid #A5D6A7;
            padding: 8px;
            border-radius: 12px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            display: none;
            width: 100%;
        }

        .finish-screen {
            padding: 15px 5px;
            width: 100%;
        }

        .start-btn {
            background: var(--bright-green);
            color: white;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2E7D32;
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2E7D32;
        }

        .correct-flash {
            animation: successFlash 0.3s ease-out;
        }

        @keyframes successFlash {
            0%, 100% { background-color: white; }
            50% { background-color: #E8F5E9; }
        }
    </style>
</head>
<body>

        <header>
            <h1>🎈 Magic Maths Quest! 🎈</h1>
        </header>

        <div class="set-selector-bar">

                <div class="goal-post">👑</div>

            <div class="gameboard" id="gameArena">

        </div>
    </div>
