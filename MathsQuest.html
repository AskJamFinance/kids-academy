<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Pokémon Addition Adventure Quest! ⚡</title>
    <style>
        :root {
            --sky-blue: #00A8E8;
            --sunny-yellow: #FFD166;
            --apple-red: #EF476F;
            --grass-green: #06D6A0;
            --royal-purple: #118AB2;
            --bg-creme: #FDFBF7;
            --text-main: #2B2D42;
            --master-gold: #FFB703;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F0F7F4;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            background: white;
            padding: 12px 25px;
            border-radius: 25px;
            box-shadow: 0 6px 0 #CBD5E1;
            border: 3px solid var(--sky-blue);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--royal-purple);
            text-shadow: 2px 2px 0px var(--sunny-yellow);
        }

        /* MASTER GLOBAL LEADERBOARD RIBBON */
        .master-hall-fame {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            border: 4px solid var(--master-gold);
            border-radius: 22px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            color: white;
        }

        .master-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #0F172A;
            background: var(--master-gold);
            padding: 6px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            min-width: 140px;
        }

        .master-rail-bg {
            height: 24px;
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.4);
            overflow: visible;
        }

        .master-rail-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #FFD166, #F77F00, #EF476F);
            border-radius: 12px;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .master-trophy-token {
            position: absolute;
            left: 0%;
            top: 50%;
            transform: translate(-50%, -55%);
            font-size: 2.2rem;
            transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
        }

        .master-score-badge {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--master-gold);
            min-width: 85px;
            text-align: right;
        }

        /* Category Tabs Layout Split (1 to 10 Quests) */
        .stage-map {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        .map-node-btn {
            background: white;
            border: 3px solid #64748B;
            padding: 8px 4px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #64748B;
            transition: all 0.1s ease;
            color: #334155;
            text-align: center;
        }

        .map-node-btn.active {
            color: white;
            transform: translateY(3px);
            box-shadow: 0 1px 0 transparent !important;
        }

        .map-node-btn[data-lvl="1"].active { background: #EF476F; border-color: #D62246; box-shadow: 0 1px 0 #D62246; }
        .map-node-btn[data-lvl="2"].active { background: #F77F00; border-color: #C16200; box-shadow: 0 1px 0 #C16200; }
        .map-node-btn[data-lvl="3"].active { background: #FFB703; border-color: #FB8500; box-shadow: 0 1px 0 #FB8500; color: #023047; }
        .map-node-btn[data-lvl="4"].active { background: #06D6A0; border-color: #05B386; box-shadow: 0 1px 0 #05B386; }
        .map-node-btn[data-lvl="5"].active { background: #7209B7; border-color: #56038D; box-shadow: 0 1px 0 #56038D; }
        .map-node-btn[data-lvl="6"].active { background: #118AB2; border-color: #0B6A8A; box-shadow: 0 1px 0 #0B6A8A; }
        .map-node-btn[data-lvl="7"].active { background: #073B4C; border-color: #021E26; box-shadow: 0 1px 0 #021E26; }
        .map-node-btn[data-lvl="8"].active { background: #FF4D6D; border-color: #C9184A; box-shadow: 0 1px 0 #C9184A; }
        .map-node-btn[data-lvl="9"].active { background: #FF758F; border-color: #FF4D6D; box-shadow: 0 1px 0 #FF4D6D; }
        .map-node-btn[data-lvl="10"].active { background: #52B788; border-color: #2D6A4F; box-shadow: 0 1px 0 #2D6A4F; }

        /* Main Display Workspace */
        .adventure-deck {
            background: var(--bg-creme);
            border-radius: 30px;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 4px solid #E2E8F0;
        }

        /* Horizontal Category Ribbon Component */
        .reward-tracker-ribbon {
            width: 100%;
            background: #EDF2F7;
            border: 3px solid #4A5568;
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12
