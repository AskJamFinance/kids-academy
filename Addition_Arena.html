<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌈 Addition Adventure Quest! 🌈</title>
    <style>
        :root {
            --sky-blue: #00A8E8;
            --sunny-yellow: #FFD166;
            --apple-red: #EF476F;
            --grass-green: #06D6A0;
            --royal-purple: #118AB2;
            --bg-creme: #FDFBF7;
            --text-main: #2B2D42;
            --master-gold: #FFB703;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F0F7F4;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            background: white;
            padding: 12px 25px;
            border-radius: 25px;
            box-shadow: 0 6px 0 #CBD5E1;
            border: 3px solid var(--sky-blue);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--royal-purple);
            text-shadow: 2px 2px 0px var(--sunny-yellow);
        }

        /* MASTER GLOBAL LEADERBOARD RIBBON */
        .master-hall-fame {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            border: 4px solid var(--master-gold);
            border-radius: 22px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            color: white;
        }

        .master-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #0F172A;
            background: var(--master-gold);
            padding: 6px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            min-width: 110px;
        }

        .master-rail-bg {
            height: 24px;
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.4);
            overflow: visible;
        }

        .master-rail-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #FFD166, #F77F00, #EF476F);
            border-radius: 12px;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .master-trophy-token {
            position: absolute;
            left: 0%;
            top: 50%;
            transform: translate(-50%, -55%);
            font-size: 2.2rem;
            transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
        }

        .master-score-badge {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--master-gold);
            min-width: 75px;
            text-align: right;
        }

        /* Category Tabs Layout Split */
        .stage-map {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        .map-node-btn {
            background: white;
            border: 3px solid #64748B;
            padding: 10px 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #64748B;
            transition: all 0.1s ease;
            color: #334155;
            flex: 1 1 calc(20% - 8px);
            min-width: 130px;
            text-align: center;
        }

        .map-node-btn.active {
            color: white;
            transform: translateY(3px);
        }

        .map-node-btn[data-lvl="1"].active { background: #EF476F; border-color: #D62246; box-shadow: 0 1px 0 #D62246; }
        .map-node-btn[data-lvl="2"].active { background: #F77F00; border-color: #D62246; box-shadow: 0 1px 0 #D62246; }
        .map-node-btn[data-lvl="3"].active { background: #FFB703; border-color: #FB8500; box-shadow: 0 1px 0 #FB8500; color: #023047; }
        .map-node-btn[data-lvl="4"].active { background: #06D6A0; border-color: #05B386; box-shadow: 0 1px 0 #05B386; }
        .map-node-btn[data-lvl="5"].active { background: #7209B7; border-color: #56038D; box-shadow: 0 1px 0 #56038D; }

        /* Main Display Workspace */
        .adventure-deck {
            background: var(--bg-creme);
            border-radius: 30px;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 4px solid #E2E8F0;
        }

        /* Horizontal Category Ribbon Component */
        .reward-tracker-ribbon {
            width: 100%;
            background: #EDF2F7;
            border: 3px solid #4A5568;
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .badge-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            background: #4A5568;
            padding: 5px 8px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .trail-path-bg {
            height: 22px;
            flex-grow: 1;
            background: #CBD5E1;
            border-radius: 11px;
            position: relative;
            border: 1px solid #94A3B8;
        }

        .trail-path-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #06D6A0, #4CC9F0);
            border-radius: 11px;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.3s ease;
        }

        .walker-token {
            position: absolute;
            left: 0%;
            top: 50%;
            transform: translate(-50%, -55%);
            font-size: 2rem;
            transition: left 0.3s ease;
            z-index: 10;
        }

        .destination-chest {
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        /* Question Frame Elements */
        .question-box {
            text-align: center;
            background: white;
            border: 3px dashed #CBD5E1;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-tag {
            background: #E2E8F0;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* AUTHENTIC MATH COLUMN METHOD STYLING */
        .column-math-container {
            display: inline-block;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 3.5rem;
            color: #1D3557;
            line-height: 1.1;
            text-align: right;
            margin: 10px 0 25px 0;
            padding: 10px 20px;
            background: #F8FAFC;
            border-radius: 15px;
            border: 2px solid #E2E8F0;
        }

        .column-row {
            display: flex;
            justify-content: flex-end;
            letter-spacing: 6px;
            position: relative;
            min-width: 140px;
        }

        .column-row.operator-row {
            border-bottom: 5px solid #1D3557;
            padding-bottom: 4px;
        }

        .column-operator {
            position: absolute;
            left: 0;
            bottom: 4px;
            font-size: 3rem;
        }

        .column-result-space {
            letter-spacing: 6px;
            color: var(--sky-blue);
            padding-top: 6px;
            font-size: 3.5rem;
            min-height: 4rem;
            text-align: right;
            font-weight: 900;
        }

        /* Option Selection Grids */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
        }

        .choice-btn {
            background: white;
            border: 3px solid #4A5568;
            border-radius: 20px;
            padding: 16px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #4A5568;
            transition: all 0.1s;
        }
        .choice-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4A5568; }

        /* DYNAMIC CONCRETE COUNTER COMPONENT */
        .visual-aid-arena {
            background: #FFF;
            border: 2px dashed #BEE3F8;
            border-radius: 15px;
            padding: 15px;
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        
        .counter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-width: 45%;
            justify-content: center;
            padding: 8px;
            border-radius: 10px;
        }
        .group-left { background-color: #EBF8FF; border: 1px solid #BEE3F8; }
        .group-right { background-color: #FFFAF0; border: 1px solid #FEEBC8; }

        .alert-cheer {
            background: #E8F5E9;
            color: #1B5E20;
            border: 2px solid #C8E6C9;
            padding: 12px;
            border-radius: 15px;
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            display: none;
            font-size: 1.1rem;
            width: 100%;
        }

        .quiz-end-card { text-align: center; padding: 25px 10px; }
        .action-start-btn {
            background: #06D6A0;
            color: white;
            border: none;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 12px 35px;
            border-radius: 18px;
            box-shadow: 0 5px 0 #05B386;
            cursor: pointer;
        }
        .action-start-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #05B386; }

        .celebrate-bounce { animation: screenJump 0.2s ease-in-out 2; }
        @keyframes screenJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        
        .hall-fame-pop { animation: goldFlash 0.4s ease-in-out; }
        @keyframes goldFlash { 0%, 100% { background: #1E293B; } 50% { background: #FFB703; transform: scale(1.02); } }
    </style>
</head>
<body>

    <header>
        <h1>🌈 Addition Adventure Quest! 🌈</h1>
    </header>

    <div class="master-hall-fame" id="global-board">
        <div class="master-label" id="global-rank">Recruit</div>
        <div class="master-rail-bg">
            <div id="master-fill" class="master-rail-fill"></div>
            <div id="master-trophy" class="master-trophy-token">🎖️</div>
        </div>
        <div class="master-score-badge" id="master-txt-score">0 / 50</div>
    </div>

    <div class="stage-map">
        <button class="map-node-btn active" data-lvl="1" onclick="switchAdditionCategoryTab(this, 1)">Set 1 (1-20)</button>
        <button class="map-node-btn" data-lvl="2" onclick="switchAdditionCategoryTab(this, 2)">Set 2 (20-40)</button>
        <button class="map-node-btn" data-lvl="3" onclick="switchAdditionCategoryTab(this, 3)">Set 3 (40-60)</button>
        <button class="map-node-btn" data-lvl="4" onclick="switchAdditionCategoryTab(this, 4)">Set 4 (60-80)</button>
        <button class="map-node-btn" data-lvl="5" onclick="switchAdditionCategoryTab(this, 5)">Set 5 (80-100)</button>
    </div>

    <div class="adventure-deck">
        <div class="reward-tracker-ribbon">
            <div class="badge-title" id="reward-lbl">Quest Base</div>
            <div class="trail-path-bg">
                <div id="reward-fill" class="trail-path-fill"></div>
                <div id="reward-walker" class="walker-token">🏃</div>
            </div>
            <div class="destination-chest">🎁</div>
        </div>

        <div id="game-arena-content"></div>
    </div>

    <script>
        let currentLevelCategory = 1;
        
        // Permanent Global Scores across sessions
        let globalTotalScore = 0;
        let categoriesBeatenFlags = { 1: false, 2: false, 3: false, 4: false, 5: false };

        let gameState = {
            currentIdx: 0,
            correctCount: 0,
            totalCount: 10,
            pool: []
        };

        const cheeringPhrases = [
            "⭐ Fantastic! You found the answer! ⭐",
            "🚀 Zoom! Rocket power correct! 🚀",
            "🎈 Yay! Outstanding counting! 🎈",
            "🎉 Brilliant! You are a math star! 🎉",
            "💎 Diamond Sparkle Job! 💎"
        ];

        const levelRanges = {
            1: { min: 0, max: 19, cap: 20, label: "Set 1 (1-20)" },
            2: { min: 10, max: 30, cap: 40, label: "Set 2 (20-40)" },
            3: { min: 20, max: 50, cap: 60, label: "Set 3 (40-60)" },
            4: { min: 30, max: 70, cap: 80, label: "Set 4 (60-80)" },
            5: { min: 40, max: 90, cap: 100, label: "Set 5 (80-100)" }
        };

        function switchAdditionCategoryTab(btnDom, targetCategoryNum) {
            document.querySelectorAll('.stage-map .map-node-btn').forEach(b => b.classList.remove('active'));
            if(btnDom) btnDom.classList.add('active');
            currentLevelCategory = targetCategoryNum;
            initiateQuestSession();
        }

        function initiateQuestSession() {
            gameState.currentIdx = 0;
            gameState.correctCount = 0;
            gameState.pool = buildRandomAdditionDataset(currentLevelCategory, gameState.totalCount);
            renderCurrentMathCard();
            refreshVisualTrailProgress();
            updateMasterGlobalRewardBar();
        }

        function buildRandomAdditionDataset(level, count) {
            let config = levelRanges[level];
            let questions = [];
            
            while(questions.length < count) {
                let addendA, addendB;
                
                if (level === 1) {
                    addendA = Math.floor(Math.random() * 21); 
                    addendB = Math.floor(Math.random() * (21 - addendA)); 
                } else {
                    addendA = Math.floor(Math.random() * (config.max - config.min)) + config.min;
                    let targetMaxB = config.cap - addendA;
                    let targetMinB = Math.max(1, config.min - 15);
                    
                    if (targetMaxB <= targetMinB) {
                        addendB = Math.floor(Math.random() * 9) + 1;
                    } else {
                        addendB = Math.floor(Math.random() * (targetMaxB - targetMinB)) + targetMinB;
                    }
                }

                let sumResult = addendA + addendB;
                
                if(sumResult >= (config.cap - 19) && sumResult <= config.cap) {
                    let choicesSet = new Set([sumResult]);
                    while(choicesSet.size < 4) {
                        let offsetValue = sumResult + (Math.floor(Math.random() * 12) - 6);
                        if(offsetValue >= 0 && offsetValue !== sumResult) choicesSet.add(offsetValue);
                    }
                    
                    questions.push({
                        numA: addendA,
                        numB: addendB,
                        correct: sumResult,
                        options: Array.from(choicesSet).sort((x,y) => x - y)
                    });
                }
            }
            return questions;
        }

        function renderCurrentMathCard() {
            const rootContainer = document.getElementById('game-arena-content');
            const data = gameState.pool[gameState.currentIdx];

            let buttonsHTML = '';
            data.options.forEach(opt => {
                buttonsHTML += `<button class="choice-btn" onclick="submitAdditionChoice(${opt}, ${data.correct})">${opt}</button>`;
            });

            let leftCounters = '🔷'.repeat(data.numA);
            let rightCounters = '🔶'.repeat(data.numB);

            let counterSectionHTML = '';
            if (data.numA <= 20 && data.numB <= 20) {
                counterSectionHTML = `
                    <div class="visual-aid-arena">
                        <div class="counter-group group-left">${leftCounters || '0'}</div>
                        <span style="font-size:1.5rem; font-weight:bold; align-self:center;">+</span>
                        <div class="counter-group group-right">${rightCounters || '0'}</div>
                    </div>
                `;
            }

            let strA = data.numA.toString();
            let strB = data.numB.toString();
            let maxLength = Math.max(strA.length, strB.length);
            
            let formattedA = strA.padStart(maxLength, ' ');
            let formattedB = strB.padStart(maxLength, ' ');

            rootContainer.innerHTML = `
                <div class="question-box">
                    <div class="progress-tag">Question ${gameState.currentIdx + 1} of ${gameState.totalCount}</div>
                    
                    <div class="column-math-container">
                        <div class="column-row">${formattedA.replace(/ /g, '&nbsp;')}</div>
                        <div class="column-row operator-row">
                            <span class="column-operator">+</span>
                            ${formattedB.replace(/ /g, '&nbsp;')}
                        </div>
                        <div class="column-result-space">?</div>
                    </div>

                    <div class="answers-grid">${buttonsHTML}</div>
                    <div class="alert-cheer" id="quest-cheer-box"></div>
                    ${counterSectionHTML}
                </div>
            `;
        }

        function submitAdditionChoice(userClicked, correctValue) {
            const workspaceContainer = document.querySelector('.adventure-deck');
            const cheerBox = document.getElementById('quest-cheer-box');

            if(userClicked === correctValue) {
                gameState.correctCount++;
                workspaceContainer.classList.add('celebrate-bounce');
                setTimeout(() => workspaceContainer.classList.remove('celebrate-bounce'), 250);
                
                cheerBox.innerText = cheeringPhrases[Math.floor(Math.random() * cheeringPhrases.length)];
                cheerBox.style.display = "block";
            } else {
                if(cheerBox) cheerBox.style.display = "none";
            }

            gameState.currentIdx++;
            refreshVisualTrailProgress();

            setTimeout(() => {
                if(gameState.currentIdx < gameState.totalCount) {
                    renderCurrentMathCard();
                } else {
                    processCategoryCompletionCalculations();
                }
            }, 600);
        }

        function refreshVisualTrailProgress() {
            const fill = document.getElementById('reward-fill');
            const walker = document.getElementById('reward-walker');
            const label = document.getElementById('reward-lbl');
            const currentConfig = levelRanges[currentLevelCategory];

            let fillPercentage = Math.round((gameState.currentIdx / gameState.totalCount) * 100);
            fill.style.width = `${fillPercentage}%`;
            walker.style.left = `${fillPercentage}%`;

            let stepCount = gameState.correctCount;
            if(stepCount === 0) { walker.innerText = "🏃"; label.innerText = `Track: Start`; }
            else if(stepCount < 4) { walker.innerText = "👟"; label.innerText = "Marching!"; }
            else if(stepCount < 7) { walker.innerText = "🚲"; label.innerText = "Halfway!"; }
            else if(stepCount < 10) { walker.innerText = "🚀"; label.innerText = "Closing In!"; }
            else { walker.innerText = "🎁"; label.innerText = "Set Cleared!"; }
        }

        // TRIGGERS GLOBAL PIPELINE MULTIPLEX CRITERIA LOADING
        function processCategoryCompletionCalculations() {
            // Commit current set scores permanently to the main global metrics tracker
            globalTotalScore += gameState.correctCount;
            categoriesBeatenFlags[currentLevelCategory] = true;

            // Trigger global visualization flash animation
            const globalBoard = document.getElementById('global-board');
            globalBoard.classList.add('hall-fame-pop');
            setTimeout(() => globalBoard.classList.remove('hall-fame-pop'), 500);

            updateMasterGlobalRewardBar();
            renderQuestEndSummary();
        }

        function updateMasterGlobalRewardBar() {
            const mFill = document.getElementById('master-fill');
            const mTrophy = document.getElementById('master-trophy');
            const mTxtScore = document.getElementById('master-txt-score');
            const mRank = document.getElementById('global-rank');

            // 5 sets x 10 questions = 50 maximum reachable total points
            let globalPercentage = Math.min(100, Math.round((globalTotalScore / 50) * 100));
            mFill.style.width = `${globalPercentage}%`;
            mTrophy.style.left = `${globalPercentage}%`;
            mTxtScore.innerText = `${globalTotalScore} / 50`;

            // Dynamic ranking badge updates based on accumulative points milestones
            if(globalTotalScore === 0) {
                mRank.innerText = "Recruit 🎒"; mRank.style.backgroundColor = "#94A3B8";
            } else if (globalTotalScore < 15) {
                mRank.innerText = "Explorer 🧭"; mRank.style.backgroundColor = "#3B82F6";
            } else if (globalTotalScore < 30) {
                mRank.innerText = "Knight ⚔️"; mRank.style.backgroundColor = "#F59E0B";
            } else if (globalTotalScore < 45) {
                mRank.innerText = "Hero 🔥"; mRank.style.backgroundColor = "#EF4444";
            } else if (globalTotalScore < 50) {
                mRank.innerText = "Mythic ⚡"; mRank.style.backgroundColor = "#8B5CF6";
            } else {
                mRank.innerText = "CHAMPION 👑"; mRank.style.backgroundColor = "#10B981"; mTrophy.innerText = "🏆";
            }
        }

        function renderQuestEndSummary() {
            const rootContainer = document.getElementById('game-arena-content');
            let successRatio = Math.round((gameState.correctCount / gameState.totalCount) * 100);
            let performanceHTML = '';

            if(successRatio === 100) {
                performanceHTML = `<span style="font-size:4.5rem;">💎🏆💎</span><h2 style="color:var(--grass-green);">PERFECT LEVEL ACCOMPLISHED!</h2><p>Terrific column math calculating work! <b>+10 Points</b> have been wired straight to your Master Hall of Fame bar above!</p>`;
            } else if (successRatio >= 70) {
                performanceHTML = `<span style="font-size:4rem;">🌟🥈</span><h2>QUEST ATTAINED!</h2><p>Good job! You earned <b>+${gameState.correctCount} Points</b> for your Master Bar. Let's rerun the set to capture a flawless 10/10 prize!</p>`;
            } else {
                performanceHTML = `<span style="font-size:4rem;">🎒🏕️</span><h2>POINTS LOCKED IN</h2><p>You added <b>+${gameState.correctCount} Points</b> to your Master Bar. Let's do another run to boost your global score higher!</p>`;
            }

            rootContainer.innerHTML = `
                <div class="quiz-end-card">
                    ${performanceHTML}<br>
                    <button class="action-start-btn" onclick="initiateQuestSession()">🔄 Replay This Category</button>
                </div>
            `;
        }

        window.onload = () => { initiateQuestSession(); };
    </script>
</body>
</html>
