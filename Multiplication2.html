<div class="master-hall-fame" id="global-board">
    <div class="master-label" id="global-rank">Recruit</div>
    <div class="master-rail-bg">
        <div id="master-fill" class="master-rail-fill"></div>
        <div id="master-trophy" class="master-trophy-token">🎖️</div>
    </div>
    <div class="master-score-badge" id="master-txt-score">0 / 80</div>
</div>

<style>
    :root {
        --master-gold: #FFB703;
    }

    .master-hall-fame {
        width: 100%;
        max-width: 800px;
        background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
        border: 4px solid var(--master-gold);
        border-radius: 22px;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        color: white;
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
    }

    .master-label {
        font-size: 0.85rem;
        font-weight: bold;
        color: #0F172A;
        background: var(--master-gold);
        padding: 6px 12px;
        border-radius: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        min-width: 120px;
    }

    .master-rail-bg {
        height: 24px;
        flex-grow: 1;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.4);
        overflow: visible;
    }

    .master-rail-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(to right, #FFD166, #F77F00, #EF476F);
        border-radius: 12px;
        position: absolute;
        left: 0;
        top: 0;
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .master-trophy-token {
        position: absolute;
        left: 0%;
        top: 50%;
        transform: translate(-50%, -55%);
        font-size: 2.2rem;
        transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10;
        filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
    }

    .master-score-badge {
        font-size: 1.1rem;
        font-weight: bold;
        color: var(--master-gold);
        min-width: 90px;
        text-align: right;
    }

    /* Flash update animation */
    .hall-fame-pop { animation: goldFlash 0.4s ease-in-out; }
    @keyframes goldFlash { 
        0%, 100% { background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%); } 
        50% { background: #FFB703; transform: scale(1.01); } 
    }
</style>

<script>
    /**
     * Call this function to change score metrics dynamically
     * @param {number} globalScorePoints - Current combined score points
     */
    function updateMasterLeaderboardUI(globalScorePoints) {
        const totalPointsCap = 80; 
        const mBoard = document.getElementById('global-board');
        const mFill = document.getElementById('master-fill');
        const mTrophy = document.getElementById('master-trophy');
        const mTxtScore = document.getElementById('master-txt-score');
        const mRank = document.getElementById('global-rank');

        // Triggers pop animation flash
        mBoard.classList.add('hall-fame-pop');
        setTimeout(() => mBoard.classList.remove('hall-fame-pop'), 400);

        // Adjust Bar Visual Positions
        let masterPercentage = Math.min(100, Math.round((globalScorePoints / totalPointsCap) * 100));
        mFill.style.width = `${masterPercentage}%`;
        mTrophy.style.left = `${masterPercentage}%`;
        mTxtScore.innerText = `${globalScorePoints} / ${totalPointsCap}`;

        // Calculate Ranking Tier Titles
        if(globalScorePoints === 0) {
            mRank.innerText = "Recruit 🎒"; mRank.style.backgroundColor = "#94A3B8";
        } else if (globalScorePoints < 20) {
            mRank.innerText = "Apprentice 🧭"; mRank.style.backgroundColor = "#3B82F6";
        } else if (globalScorePoints < 40) {
            mRank.innerText = "Knight ⚔️"; mRank.style.backgroundColor = "#F59E0B";
        } else if (globalScorePoints < 60) {
            mRank.innerText = "Elite Hero 🔥"; mRank.style.backgroundColor = "#EF4444";
        } else if (globalScorePoints < 80) {
            mRank.innerText = "Grandmaster ⚡"; mRank.style.backgroundColor = "#8B5CF6";
        } else {
            mRank.innerText = "CHAMPION 👑"; mRank.style.backgroundColor = "#10B981"; 
            mTrophy.innerText = "🏆";
        }
    }
    
    // Example test update invocation:
    // updateMasterLeaderboardUI(42);
</script>
